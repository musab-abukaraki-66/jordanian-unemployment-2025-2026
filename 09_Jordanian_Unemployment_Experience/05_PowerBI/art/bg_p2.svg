<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#F1ECE2"/>
<line x1="48" y1="52" x2="1392" y2="52" stroke="#1C1B19" stroke-width="1"/>
<text x="48" y="40" font-family="'Segoe UI', sans-serif" font-size="13.0" font-weight="400" fill="#40372F" text-anchor="start" letter-spacing="1.4" opacity="1" >1  THE NUMBER</text>
<text x="208" y="40" font-family="'Segoe UI', sans-serif" font-size="13.0" font-weight="700" fill="#1C1B19" text-anchor="start" letter-spacing="1.4" opacity="1" >2  THE PEOPLE</text>
<rect x="208" y="44" width="130" height="3" fill="#B5472E" opacity="1"/>
<text x="368" y="40" font-family="'Segoe UI', sans-serif" font-size="13.0" font-weight="400" fill="#40372F" text-anchor="start" letter-spacing="1.4" opacity="1" >3  THE PLACES</text>
<text x="1392" y="40" font-family="'Segoe UI', sans-serif" font-size="12.4" font-weight="400" fill="#40372F" text-anchor="end" letter-spacing="1.2" opacity="1" >JORDANIAN CITIZENS  ·  DoS LABOUR FORCE SURVEY  ·  2025–2026</text>
<text x="48" y="100" font-family="'Segoe UI', sans-serif" font-size="13.0" font-weight="700" fill="#B5472E" text-anchor="start" letter-spacing="1.8" opacity="1" >THE PEOPLE  ·  WHO IS BEHIND THE RATE</text>
<text x="48" y="152" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#1C1B19" text-anchor="start" letter-spacing="0" opacity="1" >The rate and the people</text>
<text x="48" y="202" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#1C1B19" text-anchor="start" letter-spacing="0" opacity="1" >tell opposite stories.</text>
<text x="48" y="246" font-family="'Segoe UI', sans-serif" font-size="15.8" font-weight="400" fill="#40372F" text-anchor="start" letter-spacing="0" opacity="1" >Two lenses on the same Jordanians. Switch the lens on the left; compare it with the rate on the right.</text>
<text x="48" y="322" font-family="'Segoe UI', sans-serif" font-size="12.4" font-weight="700" fill="#40372F" text-anchor="start" letter-spacing="1.4" opacity="1" >LENS</text>
<text x="48" y="364" font-family="'Segoe UI', sans-serif" font-size="13.0" font-weight="700" fill="#1C1B19" text-anchor="start" letter-spacing="1.2" opacity="1" >100 UNEMPLOYED JORDANIANS, 2025</text>
<text x="760" y="364" font-family="'Segoe UI', sans-serif" font-size="13.0" font-weight="700" fill="#1C1B19" text-anchor="start" letter-spacing="1.0" opacity="1" >UNEMPLOYED IN EVERY 100 IN THE LABOUR FORCE  ·  DERIVED, 2025</text>
<text x="760" y="772" font-family="Georgia, serif" font-size="15.8" font-weight="700" fill="#1C1B19" text-anchor="start" letter-spacing="0" opacity="1" >Why both are true</text>
<text x="760" y="796" font-family="'Segoe UI', sans-serif" font-size="14.1" font-weight="400" fill="#40372F" text-anchor="start" letter-spacing="0" opacity="1" >Only 14.7 in 100 Jordanian women are in the labour force, against 53.6 in 100 men (Q2 2026).</text>
<text x="760" y="818" font-family="'Segoe UI', sans-serif" font-size="14.1" font-weight="400" fill="#40372F" text-anchor="start" letter-spacing="0" opacity="1" >A higher rate on a small base is fewer people than a lower rate on a large one.</text>
<rect x="48" y="777" width="80.0" height="20" fill="#B5472E" opacity="1"/>
<text x="59" y="791" font-family="'Segoe UI', sans-serif" font-size="12.4" font-weight="600" fill="#F1ECE2" text-anchor="start" letter-spacing="0.4" opacity="1" >DERIVED</text>
<rect x="136.0" y="777" width="248.0" height="20" fill="#D8C8A8" opacity="1"/>
<text x="147.0" y="791" font-family="'Segoe UI', sans-serif" font-size="12.4" font-weight="600" fill="#1C1B19" text-anchor="start" letter-spacing="0.4" opacity="1" >LIMITED EVIDENCE: SMALL BASE</text>
<text x="48" y="818" font-family="'Segoe UI', sans-serif" font-size="14.1" font-weight="400" fill="#40372F" text-anchor="start" letter-spacing="0" opacity="1" >Youth (15–24): 47.2% in 2025, from annual counts. DoS publishes age 24+ only (18.0% in Q2 2026).</text>
<text x="48" y="870" font-family="'Segoe UI', sans-serif" font-size="13.0" font-weight="400" fill="#40372F" text-anchor="start" letter-spacing="0" opacity="1" >Source: DoS PxWeb counts EMPALL1/EMPALL (2025 annual, Jordanians 15+); participation from the DoS Q2 2026 release. Shares rounded to whole people per 100.</text>
<line x1="48" y1="846" x2="1392" y2="846" stroke="#CFC6B3" stroke-width="1"/>
<rect x="1160" y="852" width="232" height="34" fill="#1C1B19" opacity="1"/>
<text x="1276" y="874" font-family="'Segoe UI', sans-serif" font-size="13.6" font-weight="600" fill="#F1ECE2" text-anchor="middle" letter-spacing="0.4" opacity="1" >NEXT: WHERE ARE THEY?  →</text></svg>